# Every key can be overridden from the command line, e.g. mvn test -Dbase.uri=http://localhost:8080/v2
base.uri=https://petstore.swagger.io/v2
api.key=special-key

# Log every request/response to the console (Allure always captures them regardless).
api.logging.enabled=false

# The public Petstore is load balanced across nodes that sync lazily; reads after writes are retried.
poll.attempts=10
poll.interval.millis=1000
