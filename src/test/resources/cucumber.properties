# Read by the Cucumber CLI, which is what IntelliJ uses to run a single feature/scenario (it ignores
# junit-platform.properties). Without the Allure plugin here, AllureRestAssured has no test to attach
# requests to and logs "Could not add attachment: no test is running".
cucumber.plugin=io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.publish.quiet=true
cucumber.glue=org.example.tbc_swagger_api_project
